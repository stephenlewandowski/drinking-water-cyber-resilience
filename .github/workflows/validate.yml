name: Validate released exhibit

on:
  push:
    branches: [main, public-release]
  pull_request:
    branches: [main, public-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run project validator
        run: python3 tests/validate_project.py